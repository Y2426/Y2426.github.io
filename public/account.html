<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邮箱与账号 · Echo</title><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="/admin.css"><script type="module" src="/email-account.js"></script><link rel="stylesheet" href="/i18n.css"><script type="module" src="/i18n.js"></script></head><body><main style="margin:0;min-height:100dvh;display:grid;place-items:center"><section class="panel auth" style="width:min(100%,480px);margin:20px auto"><a href="/" class="brand">echo</a><p class="eyebrow" style="margin-top:28px">YOUR LEARNING ACCOUNT</p><h1 id="title">找回登录密码</h1><p id="description">填写已验证的邮箱，我们会发送密码重置链接。</p><form id="email-form"><div id="email-fields"><label>邮箱地址<input name="email" type="email" autocomplete="email" maxlength="254" required></label></div><div id="password-fields" hidden><label>设置密码<input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="10–128 位"></label><label>确认密码<input name="confirmation" type="password" autocomplete="new-password" minlength="10" maxlength="128"></label></div><button type="submit" class="primary" id="submit">发送重置邮件</button><p id="result" role="status"></p></form><p><a href="/" id="back">返回网站登录 ↗</a></p><p class="hint" id="mail-note">验证链接 30 分钟内有效，仅可使用一次。</p></section></main></body></html>
